services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ubuntuhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ubuntuhub_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ubuntuhub_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ubuntuhub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (optionnel, pour les sessions et cache)
  redis:
    image: redis:7-alpine
    container_name: ubuntuhub_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ubuntuhub_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubuntuhub_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ubuntuhub_db}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-5001}:5000"
    volumes:
      # Mount source code pour le développement avec hot-reload
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
      - ./.env:/app/.env:ro
      - ./package.json:/app/package.json:ro
      # Mount uploads directory
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ubuntuhub_network
    command: npm run dev

  # Prisma Studio (Interface graphique pour la DB)
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubuntuhub_prisma_studio
    restart: unless-stopped
    user: root  # Run as root to avoid permission issues
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ubuntuhub_db}?schema=public
    ports:
      - "5555:5555"
    volumes:
      - ./prisma:/app/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ubuntuhub_network
    command: npx prisma studio --port 5555 --browser none

# Volumes persistants
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local

# Réseau personnalisé
networks:
  ubuntuhub_network:
    driver: bridge
